<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20355c">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="A short, editable draft for Ambika Watch & Gift, Surat. Copy your words and open Google to leave your review.">
  <meta property="og:title" content="Ambika Watch Review System">
  <meta property="og:description" content="A few words for Ambika Watch & Gift, Surat.">
  <meta property="og:type" content="website">
  <title>Ambika Watch Review System</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body lang="en">
  <main class="review-card">
    <header class="brand-header">
      <div class="brand-name"><span>AMBIKA</span><small>WATCH <b>&amp;</b> GIFT</small></div>
    </header>
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow"><span class="red-line"></span><span>YOUR VISIT. YOUR WORDS.</span></div>
      <h1 id="page-title">A few words for Ambika.</h1>
      <p>Your draft is ready.</p>
    </section>
    <form id="review-form" novalidate>
      <div class="draft-heading"><label for="review-text">Suggested review</label></div>
      <div class="review-editor"><textarea id="review-text" name="review" rows="5" maxlength="1000" spellcheck="true" aria-describedby="review-help" placeholder="Your short review…"></textarea></div>
      <p class="review-help" id="review-help">Suggested draft. Edit it to match your visit.</p>
      <button type="submit" id="copy-open" class="primary-button" disabled><span>Copy &amp; Leave Review</span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <footer><span>AMBIKA WATCH &amp; GIFT</span><span class="footer-dot">·</span><span>Surat, Gujarat</span><small>Your edits stay in this tab.</small></footer>
  </main>
  <p class="thank-you">Thank you for your time.</p>
  <noscript><p class="noscript">Please enable JavaScript to see a draft, or <a href="https://search.google.com/local/writereview?placeid=ChIJ4dkN_wJP4DsRaUIpMlm4KN8">write directly on Google</a>.</p></noscript>
</body>
</html>
